<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run map</title>
<!-- The run map's page. scripts/run-charts fills in the data (the line "const DATA = ...") and writes
     run-map.html, run-map.svg (this page, carried for T3) and run-map-t3.html (the short page to
     paste into html_render). See references/final-report.md, "Run map". -->
<style>
:root {
  --rm-card: var(--card, #ffffff); --rm-fg: var(--foreground, #18181b); --rm-muted: var(--muted-foreground, #71717a);
  --rm-border: var(--border, #e4e4e7); --rm-soft: var(--secondary, #f4f4f5);
  --rm-line: color-mix(in srgb, var(--info, #3b82f6) 62%, transparent);
  --rm-ok: var(--success, #16a34a); --rm-warn: var(--warning, #d97706); --rm-bad: var(--destructive, #dc2626); --rm-info: var(--info, #2563eb);
  --rm-above: #7c3aed; --rm-xhigh: #2563eb; --rm-high: #0d9488;
  --rm-radius: 12px; --cv-h: 620px;
}
:root[data-theme="dark"] { --rm-card: var(--card, #1f1f23); --rm-fg: var(--foreground, #fafafa); --rm-muted: var(--muted-foreground, #a1a1aa); --rm-border: var(--border, #2e2e33); --rm-soft: var(--secondary, #27272a); }
:root[data-theme="dark"] body { background: var(--background, #18181b); }
@media (prefers-color-scheme: dark) { :root { --rm-card: var(--card, #1f1f23); --rm-fg: var(--foreground, #fafafa); --rm-muted: var(--muted-foreground, #a1a1aa); --rm-border: var(--border, #2e2e33); --rm-soft: var(--secondary, #27272a); } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", sans-serif); color: var(--rm-fg); }
.rm { width: 100%; font-size: 14px; line-height: 1.35; padding: 4px 0 8px; }
.rm-error { color: var(--rm-bad); font-size: 13px; }
.rm-head { display: flex; align-items: center; justify-content: space-between; gap: 6px 12px; flex-wrap: wrap; margin: 0 0 10px; }
.rm-title { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 600; }
.rm-title .spark { color: var(--rm-info); font-size: 18px; }
.rm-title .sub { font-weight: 400; color: var(--rm-muted); font-size: 14px; }
.rm-stats { color: var(--rm-muted); font-size: 13px; display: flex; gap: 4px 12px; flex-wrap: wrap; }
.rm-stats b { color: var(--rm-fg); font-weight: 600; } .rm-stats .ok { color: var(--rm-ok); } .rm-stats .bad { color: var(--rm-bad); }
.rm-controls { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 10px; align-items: center; }
.rm-toggle { font: inherit; font-size: 12.5px; border: 1px solid var(--rm-border); background: var(--rm-card); color: var(--rm-muted); border-radius: 999px; padding: 4px 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.rm-toggle[aria-pressed="true"] { color: var(--rm-fg); border-color: color-mix(in srgb, var(--rm-info) 45%, var(--rm-border)); background: color-mix(in srgb, var(--rm-info) 9%, var(--rm-card)); }
.rm-toggle .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .55; }
.rm-toggle[aria-pressed="true"] .dot { background: var(--rm-info); opacity: 1; }
.rm-legend { margin-left: auto; padding-right: 4px; display: flex; gap: 12px; font-size: 12px; color: var(--rm-muted); flex-wrap: wrap; }
.rm-legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px; }

/* the canvas */
.cv { position: relative; height: var(--cv-h); border: 1px solid var(--rm-border); border-radius: var(--radius, 14px); overflow: hidden; cursor: grab; touch-action: none;
  user-select: none; -webkit-user-select: none;
  background-color: color-mix(in srgb, var(--rm-soft) 45%, transparent);
  background-image: radial-gradient(color-mix(in srgb, var(--rm-muted) 30%, transparent) 1px, transparent 1.2px); background-size: 22px 22px; }
.cv.dragging, .cv.dragging .card { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.world.anim { transition: transform .32s cubic-bezier(.2,.7,.2,1); }
.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.edge { fill: none; stroke-width: 2; stroke-linecap: round; transition: opacity .15s; }
.edge.spawn, .edge.sub { stroke: var(--rm-line); }
.edge.need { stroke: var(--rm-warn); opacity: .85; }
.edge.place { stroke: var(--rm-muted); stroke-dasharray: 1 5; opacity: .9; }
.edge.relaunch { stroke: var(--rm-muted); stroke-dasharray: 4 4; opacity: .8; }
.rm.no-deps .edge.need, .rm.no-deps .edge.place, .rm.no-deps .dotn.need { display: none; }
.dotn { fill: var(--rm-card); stroke: var(--rm-line); stroke-width: 2; } .dotn.need { stroke: var(--rm-warn); }
.cv-tools { position: absolute; right: 12px; top: 12px; display: flex; gap: 4px; z-index: 8; }
.cv-tools button { font: inherit; font-size: 13px; min-width: 30px; height: 30px; padding: 0 9px; border-radius: 8px; border: 1px solid var(--rm-border); background: var(--rm-card); color: var(--rm-fg); cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.cv-tools button:hover { background: var(--rm-soft); }
.cv-tools .zoomv { min-width: 46px; color: var(--rm-muted); font-variant-numeric: tabular-nums; }
.cv-hint { position: absolute; left: 12px; bottom: 10px; font-size: 11.5px; color: var(--rm-muted); background: color-mix(in srgb, var(--rm-card) 85%, transparent); padding: 3px 8px; border-radius: 6px; pointer-events: none; z-index: 8; }

/* cards */
.card { position: absolute; left: 0; top: 0; background: var(--rm-card); border: 1px solid var(--rm-border); border-radius: var(--rm-radius); cursor: grab;
  padding: 12px 14px 11px; box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.05); transition: opacity .15s, box-shadow .15s, border-color .15s; }
.card.hidden { display: none; }
.card.appear { animation: rm-appear .28s ease-out backwards; }
@keyframes rm-appear { from { opacity: 0; } }
.card.moving { box-shadow: 0 2px 4px rgba(0,0,0,.08), 0 12px 32px rgba(0,0,0,.16); }
.card.is-replaced { opacity: .6; } .card.is-replaced .c-name { text-decoration: line-through; text-decoration-color: var(--rm-muted); }
.card.is-parked { border-style: dashed; opacity: .75; box-shadow: none; }
.card.is-blocked { border-color: color-mix(in srgb, var(--rm-bad) 75%, var(--rm-border)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--rm-bad) 75%, transparent); }
.card.is-failed { border-color: color-mix(in srgb, var(--rm-warn) 75%, var(--rm-border)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--rm-warn) 75%, transparent); }
.card.helper { padding: 10px 12px 10px; }
.c-top { display: flex; gap: 10px; align-items: flex-start; }
.c-icon { flex: 0 0 auto; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--rm-border); display: grid; place-items: center; background: var(--rm-card); }
.c-icon.letter { font-size: 15px; font-weight: 650; color: var(--rm-muted); }
.helper .c-icon { width: 32px; height: 32px; border-radius: 9px; }
.mk { display: block; width: 18px; height: 18px; background: currentColor; -webkit-mask: var(--mk) center / contain no-repeat; mask: var(--mk) center / contain no-repeat; }
.helper .mk { width: 16px; height: 16px; }
.c-names { flex: 1 1 auto; min-width: 0; }
.c-row1 { display: flex; gap: 8px; align-items: flex-start; }
.c-name { flex: 1 1 auto; min-width: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.helper .c-name { font-size: 15px; }
.c-id { color: var(--rm-muted); font-weight: 600; margin-right: 5px; font-size: 14px; }
.c-model { color: var(--rm-muted); font-size: 13px; display: flex; align-items: center; gap: 5px; white-space: nowrap; overflow: hidden; }
.effort { display: inline-flex; align-items: center; gap: 4px; } .effort i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.pill { flex: 0 0 auto; font-size: 12.5px; font-weight: 500; border-radius: 7px; padding: 2px 8px; display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }
.pill.ok { color: var(--rm-ok); background: color-mix(in srgb, var(--rm-ok) 13%, transparent); }
.pill.grey { color: var(--rm-muted); background: var(--rm-soft); }
.pill.bad { color: var(--rm-bad); background: color-mix(in srgb, var(--rm-bad) 12%, transparent); }
.pill.warn { color: var(--rm-warn); background: color-mix(in srgb, var(--rm-warn) 12%, transparent); }
.pill.info { color: var(--rm-info); background: color-mix(in srgb, var(--rm-info) 12%, transparent); }
.c-summary { margin: 8px 0 0; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.c-summary:empty { display: none; }
.helper .c-summary { margin-top: 7px; font-size: 13.5px; }
.rm.brief .card:not(.helper):not(.orch) .c-summary { display: none; }
.c-foot { margin-top: 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--rm-muted); font-variant-numeric: tabular-nums; }
.c-foot .strong { color: var(--rm-fg); font-weight: 500; }
.chip { border-radius: 6px; padding: 1px 6px; font-size: 12px; border: 0; font-family: inherit; }
.chip.pause { color: var(--rm-bad); background: color-mix(in srgb, var(--rm-bad) 10%, transparent); }
.chip.note { color: var(--rm-info); background: color-mix(in srgb, var(--rm-info) 10%, transparent); }
.chip.need { color: var(--rm-warn); background: color-mix(in srgb, var(--rm-warn) 12%, transparent); }
.chip.place { color: var(--rm-muted); background: var(--rm-soft); }
.chip.pics { color: var(--rm-fg); background: var(--rm-soft); cursor: pointer; }
.chip.pics:hover { background: color-mix(in srgb, var(--rm-info) 14%, var(--rm-soft)); }
.kid-toggle { margin-left: auto; font: inherit; font-size: 13px; color: var(--rm-muted); background: transparent; border: 0; border-radius: 7px; padding: 2px 4px 2px 7px; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; }
.kid-toggle:hover { background: var(--rm-soft); color: var(--rm-fg); }
.c-foot .toggles { margin-left: auto; display: inline-flex; gap: 2px; } .toggles .kid-toggle { margin-left: 0; }
.kid-toggle svg { width: 12px; height: 12px; transition: transform .15s; } .kid-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
.kid-toggle.side svg { transform: rotate(-90deg); } .kid-toggle.side[aria-expanded="true"] svg { transform: rotate(90deg); }
.rm.focus .card { opacity: .35; }
.rm.focus .card.hl, .rm.focus .card.hl-kid { opacity: 1; }
.rm.focus .card.hl { border-color: color-mix(in srgb, var(--rm-warn) 60%, var(--rm-border)); }
.rm.focus .card.hl-self { opacity: 1; border-color: color-mix(in srgb, var(--rm-info) 65%, var(--rm-border)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--rm-info) 15%, transparent); }
.rm.focus .edge { opacity: .12; } .rm.focus .edge.hl { opacity: 1; stroke-width: 2.5; }

/* the full text of a card, on hover */
.peek { position: absolute; z-index: 7; pointer-events: none; background: var(--rm-card); border: 1px solid var(--rm-border); border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,.18); padding: 11px 13px 10px; font-size: 13.5px; opacity: 0; transform: translateY(3px); transition: opacity .12s, transform .12s; }
.peek.on { opacity: 1; transform: none; }
.peek .p-name { font-weight: 600; font-size: 14.5px; }
.peek .p-model { color: var(--rm-muted); font-size: 12.5px; margin-top: 2px; }
.peek .p-sum { margin-top: 7px; }
.peek .p-foot { margin-top: 7px; color: var(--rm-muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }

/* pictures */
.gal { position: absolute; left: 12px; right: 12px; bottom: 12px; max-height: calc(100% - 64px); background: var(--rm-card); border: 1px solid var(--rm-border); border-radius: 12px;
  box-shadow: 0 10px 40px rgba(0,0,0,.18); padding: 12px; z-index: 9; display: flex; flex-direction: column; gap: 8px; cursor: default; }
.gal-head { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.gal-head .x { margin-left: auto; font: inherit; border: 0; background: var(--rm-soft); color: var(--rm-fg); border-radius: 7px; width: 28px; height: 28px; cursor: pointer; }
.gal-big { flex: 1 1 auto; min-height: 0; display: grid; place-items: center; overflow: hidden; }
.gal-big img { max-width: 100%; max-height: 100%; border-radius: 8px; border: 1px solid var(--rm-border); object-fit: contain; }
.gal-cap { font-size: 12.5px; color: var(--rm-muted); text-align: center; }
.gal-thumbs { display: flex; gap: 8px; justify-content: center; }
.gal-thumbs button { padding: 0; border: 2px solid transparent; border-radius: 8px; overflow: hidden; cursor: pointer; background: none; }
.gal-thumbs button[aria-current="true"] { border-color: var(--rm-info); }
.gal-thumbs img { display: block; height: 46px; width: auto; }

/* the timeline: a lane per agent, its turns and the waits between them, the launches and
   report-backs as lines from the orchestrator's lane */
.tl { margin-top: 18px; position: relative; background: var(--rm-card); border: 1px solid var(--rm-border); border-radius: var(--radius, 14px); padding: 16px 18px 12px;
  --tl-label: 198px; --tl-lane: 44px; --tl-orch: color-mix(in srgb, var(--rm-fg) 40%, var(--rm-card));
  --tl-dim: 30%; font-variant-numeric: tabular-nums; }
.tl-head { margin: 0 0 12px; }
.tl-title { font-size: 15px; font-weight: 600; }
.tl-stats { margin-top: 3px; display: flex; align-items: center; gap: 6px; color: var(--rm-muted); font-size: 13px; flex-wrap: wrap; min-height: 18px; }
.tl-stats svg { width: 16px; height: 16px; flex: 0 0 auto; }
.tl-stats b { color: var(--rm-fg); font-weight: 600; }
.tl-stats .sep { opacity: .6; }
.tl-body { display: grid; grid-template-columns: var(--tl-label) minmax(0, 1fr); }
.tl-labels { padding-bottom: 28px; min-width: 0; }
.tl-lab { height: var(--tl-lane); display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 0 10px 0 2px; min-width: 0; cursor: pointer; border-radius: 8px; transition: opacity .15s; }
.tl-name { display: flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600; min-width: 0; }
.tl-name .dot { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.tl-name .id { flex: 0 0 auto; color: var(--rm-muted); font-weight: 600; font-size: 12.5px; }
.tl-name .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-model { display: flex; align-items: center; gap: 5px; padding-left: 15px; color: var(--rm-muted); font-size: 12px; white-space: nowrap; overflow: hidden; min-width: 0; }
.tl-model span { overflow: hidden; text-overflow: ellipsis; }
.tl-model .mk { flex: 0 0 auto; width: 12px; height: 12px; }
.tl-model .letter { flex: 0 0 auto; width: 12px; text-align: center; font-weight: 650; font-size: 10.5px; }
.tl-lab.parked .tl-name, .tl-lab.parked .tl-model { opacity: .6; }
.tl-plot { position: relative; min-width: 0; touch-action: pan-y; }
.tl-svg { display: block; overflow: visible; }
.tl-svg [data-tip] { cursor: default; }
.tl-grid { stroke: var(--rm-border); stroke-width: 1; opacity: .7; }
.tl-base { stroke: var(--rm-border); stroke-width: 1; }
.tl-tick { fill: var(--rm-muted); font-size: 11px; text-anchor: middle; }
.tl-work { fill: var(--c); }
.tl-idle { fill: color-mix(in srgb, var(--c) var(--tl-dim), var(--rm-card)); }
.tl-untimed { fill: var(--c); opacity: .55; }
.tl-wait { fill: url(#rm-tl-hatch); stroke: color-mix(in srgb, var(--rm-muted) 35%, transparent); stroke-width: 1; }
.tl-hatch-bg { fill: color-mix(in srgb, var(--rm-muted) 10%, var(--rm-card)); }
.tl-hatch-ln { stroke: color-mix(in srgb, var(--rm-muted) 42%, transparent); stroke-width: 1.6; }
.tl-bad-bg { fill: color-mix(in srgb, var(--rm-bad) 8%, transparent); }
.tl-bad-ln { stroke: color-mix(in srgb, var(--rm-bad) 45%, transparent); stroke-width: 1.6; }
.tl-failed { fill: color-mix(in srgb, var(--x, var(--rm-bad)) 16%, var(--rm-card)); stroke: color-mix(in srgb, var(--x, var(--rm-bad)) 75%, transparent); stroke-width: 1.2; }
.tl-glyph { fill: none; stroke: var(--x, var(--rm-bad)); stroke-width: 1.4; stroke-linecap: round; }
.tl-glyph.retry { stroke: var(--rm-card); stroke-width: 1.6; }
.tl-badge { fill: var(--rm-card); stroke: var(--c); stroke-width: 1.4; }
.tl-badge.stop { stroke: none; }
.tl-glyph.retry.on-badge { stroke: var(--c); }
.tl-ring { fill: var(--rm-card); stroke: var(--c); stroke-width: 2; }
.tl-conn { fill: none; stroke: var(--c); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; opacity: .9; transition: opacity .15s; }
.tl-conn.dashed { stroke-dasharray: 3 3; }
.tl-dot { fill: var(--c); stroke: var(--rm-card); stroke-width: 2; transition: opacity .15s; }
.tl-plane { fill: url(#rm-tl-hatch-bad); }
.tl-parked { fill: var(--rm-muted); font-size: 11.5px; font-style: italic; }
.tl-g { transition: opacity .15s; }
.tl.focus .tl-g:not(.on), .tl.focus [data-lane]:not(.on), .tl.focus .tl-lab:not(.on) { opacity: .28; }
.tl-foot { margin-top: 6px; display: flex; justify-content: flex-end; }
.tl-legend { display: flex; align-items: center; justify-content: flex-end; gap: 6px 14px; flex-wrap: wrap; font-size: 12px; color: var(--rm-muted); }
.tl-legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.tl-legend i { display: inline-block; width: 16px; height: 9px; border-radius: 3px; }
.tl-legend svg { width: 14px; height: 14px; }
.tl-note { margin-top: 6px; font-size: 12px; color: var(--rm-muted); }
.tl-tip { position: absolute; z-index: 5; pointer-events: none; width: max-content; max-width: 280px; background: var(--rm-card); border: 1px solid var(--rm-border); border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,.2); padding: 10px 12px 9px; font-size: 13px; line-height: 1.38; opacity: 0; transform: translateY(3px); transition: opacity .12s, transform .12s; }
.tl-tip.on { opacity: 1; transform: none; }
.tl-tip .who { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12.5px; }
.tl-tip .who .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: 0 0 auto; }
.tl-tip .m { margin: 1px 0 0 13px; color: var(--rm-muted); font-size: 12px; }
.tl-tip .what { margin-top: 4px; }
.tl-tip .meta { margin-top: 4px; color: var(--rm-muted); font-size: 12px; }
/* the usage panel: the subscriptions' windows and the Mac, under the timeline on its time axis */
.us { margin-top: 14px; }
.us .tl-stats { margin-top: 4px; row-gap: 3px; }
.us-lab .dot { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.us-labels { position: relative; min-width: 0; }
.us-lab { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; justify-content: center; gap: 1px; padding: 0 10px 0 2px; min-width: 0; transition: opacity .15s; }
.us-lab.stack { gap: 7px; }
.us-prov { display: flex; flex-direction: column; gap: 1px; min-width: 0; border-radius: 8px; transition: opacity .15s; cursor: default; }
.us-prov .tl-model { padding-left: 15px; }
.us-sec { position: absolute; left: 2px; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--rm-muted); }
.us-plot { cursor: crosshair; }
.us-band { fill: color-mix(in srgb, var(--rm-soft) 50%, transparent); }
.us-yt { fill: var(--rm-muted); font-size: 10px; opacity: .85; }
.us-yt.r { text-anchor: end; }
.us-g { transition: opacity .15s; }
.us.focus .us-g:not(.on), .us.focus .us-prov:not(.on) { opacity: .25; }
.us-line { fill: none; stroke: var(--c); stroke-width: 2.3; stroke-linejoin: round; stroke-linecap: round; }
.us-line.more { stroke-width: 1.6; stroke-dasharray: 5 3.5; }
.tl-legend .ln.dash { border-top: 1.6px dashed var(--rm-muted); }
.us-dot1 { fill: var(--c); }
.us-fill { fill: var(--f); }
.us-avg { fill: none; stroke: var(--c); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
.us-peak { fill: var(--c); opacity: .17; }
.us-low { fill: none; stroke: var(--c); stroke-width: 1; stroke-dasharray: 2 2; opacity: .55; }
.us-ref { stroke: var(--rm-muted); stroke-width: 1; stroke-dasharray: 3 4; opacity: .5; }
.us-reset { stroke: var(--c); stroke-width: 1.1; stroke-dasharray: 2 3; opacity: .7; }
.us-cross { stroke: var(--rm-fg); stroke-width: 1; opacity: .38; pointer-events: none; }
.us-hdot { fill: var(--c); stroke: var(--rm-card); stroke-width: 2; pointer-events: none; }
.us-tip { max-width: 330px; min-width: 210px; }
.us-tip .when { font-weight: 600; font-size: 12.5px; display: flex; gap: 6px; align-items: baseline; }

    });
  };
  const peakOf = a => Math.max(...(a || []).filter(num), 0);
  if (byId.busy) {
    const items = [];
    if (mac.cpu) items.push(["var(--rm-xhigh)", "CPU", `peak ${fmt(peakOf(mac.cpu_pk), 0)}%`]);
    if (mac.gpu) items.push(["var(--rm-above)", "GPU", `peak ${fmt(peakOf(mac.gpu_pk), 0)}%`]);
    labelLine(byId.busy, items);
  }
  if (byId.mem) labelLine(byId.mem, [["var(--rm-high)", "Memory", `peak ${fmt(peakOf(mac.mem_pk))} of ${fmt(mac.mem_total || 0)} GB`]]);
  const diskVals = mac && mac.disk ? mac.disk.filter(num) : [];
  if (byId.disk) labelLine(byId.disk, [["var(--rm-warn)", "Free disk", `${fmt(diskVals[0])} → ${fmt(diskVals[diskVals.length - 1])} GB`]]);

  // the legend: only what is drawn
  const sw = (html, text) => `<span>${html}${text}</span>`;
  const longs = provs.filter(p => p.long), monthly = longs.filter(p => /monthly/.test(p.long.id)).length;
  legend.innerHTML = (longs.length ? sw('<i class="ln"></i>', (!monthly ? "Weekly window" : monthly === longs.length ? "Monthly window" : "Weekly or monthly window") + ", % left") : "")
    + (longs.some(p => p.more) ? sw('<i class="ln dash"></i>', "A model's own limit") : "")
    + (A ? sw('<i class="ln dash"></i>', "Claude API credits, $ left (estimate)") : "")
    + (longs.some(p => slotsOf(p).some(s => s.resets.length)) ? sw('<i class="ln dot"></i>', "Reset") : "")
    + (A && A.expiries.length ? sw('<i class="ln dot"></i>', "A credit expires") : "")
    + (mac ? sw('<i class="ln"></i>', "Average per minute") + sw('<i class="pk"></i>', "Peak") : "");

  // drawing, at the plot's width
  const PADL = 14, PADR = 14, TOP = 6, BOT = 4;
  const ns = (tag, attrs, parent) => { const e = P(tag, attrs); if (parent) parent.append(e); return e; };
  let X = t => t, hover = [], gHover = null, cross = null, lastX = null;
  const Yof = (b, lo, hi) => v => b.y + b.h - BOT - (Math.min(hi, Math.max(lo, v)) - lo) / (hi - lo) * (b.h - TOP - BOT);
  const f1 = v => v.toFixed(1);
  const curve = pts => {  // a smooth line that never overshoots its points (monotone cubic)
    const n = pts.length; if (n < 2) return "";
    const dx = [], m = [], t = new Array(n).fill(0);
    for (let i = 0; i < n - 1; i++) { dx[i] = pts[i + 1][0] - pts[i][0]; m[i] = dx[i] ? (pts[i + 1][1] - pts[i][1]) / dx[i] : 0; }
    t[0] = m[0]; t[n - 1] = m[n - 2];
    for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
    for (let i = 0; i < n - 1; i++) {
      if (m[i] === 0) { t[i] = t[i + 1] = 0; continue; }
      const a = t[i] / m[i], c = t[i + 1] / m[i], s = a * a + c * c;
      if (s > 9) { const k = 3 / Math.sqrt(s); t[i] = k * a * m[i]; t[i + 1] = k * c * m[i]; }
    }
    let d = `M${f1(pts[0][0])} ${f1(pts[0][1])}`;
    for (let i = 0; i < n - 1; i++) { const h = dx[i] / 3; d += `C${f1(pts[i][0] + h)} ${f1(pts[i][1] + t[i] * h)} ${f1(pts[i + 1][0] - h)} ${f1(pts[i + 1][1] - t[i + 1] * h)} ${f1(pts[i + 1][0])} ${f1(pts[i + 1][1])}`; }
    return d;
  };
  const poly = pts => pts.map(([x, yy], i) => `${i ? "L" : "M"}${f1(x)} ${f1(yy)}`).join("");
  const tickStep = w => { const per = (t1 - t0) / Math.max(1, w / 74); return [5, 10, 15, 30, 60, 120, 180, 240, 360, 720, 1440].find(s => s >= per) || 1440; };
  // a Mac series as runs of (x, y) points, one per minute (several minutes to a point when the plot is narrow)
  function runs(arr, y, w) {
    const per = (w - PADL - PADR) / (t1 - t0), k = per >= 0.7 ? 1 : Math.ceil(0.9 / per), out = [];
    let cur = [];
    for (let i = 0; i < arr.length; i += k) {
      const grp = arr.slice(i, i + k).filter(num);
      if (!grp.length) { if (cur.length) out.push(cur); cur = []; continue; }
      cur.push([X(U.start + i + Math.min(k, arr.length - i) / 2), y(grp.reduce((s, v) => s + v, 0) / grp.length)]);
    }
    if (cur.length) out.push(cur);
    return out;
  }
  const peakRuns = (arr, y, w, take) => {
    const per = (w - PADL - PADR) / (t1 - t0), k = per >= 0.7 ? 1 : Math.ceil(0.9 / per), out = []; let cur = [];
    for (let i = 0; i < arr.length; i += k) {
      const grp = arr.slice(i, i + k).filter(num);
      if (!grp.length) { if (cur.length) out.push(cur); cur = []; continue; }
      cur.push([X(U.start + i + Math.min(k, arr.length - i) / 2), y(take(grp))]);
    }
    if (cur.length) out.push(cur);
    return out;
  };
  const valueAt = (slot, m) => {  // a window's use at minute m, between its readings
    for (const seg of slot.segs) {
      if (m < seg[0][0] || m > seg[seg.length - 1][0]) continue;
      for (let i = 0; i < seg.length - 1; i++) if (m <= seg[i + 1][0]) { const [a, va] = seg[i], [b, vb] = seg[i + 1]; return b === a ? vb : va + (vb - va) * (m - a) / (b - a); }
      return seg[seg.length - 1][1];
    }
    return null;
  };

  function draw() {
    const w = plot.clientWidth; if (w < 60) return;
    X = t => PADL + (t - t0) / (t1 - t0) * (w - PADL - PADR);
    svg.setAttribute("width", w); svg.setAttribute("height", H + AX); svg.setAttribute("viewBox", `0 0 ${w} ${H + AX}`);
    svg.replaceChildren(); hover = [];
    const defs = ns("defs", {}, svg);
    defs.innerHTML = `<clipPath id="rm-us-clip"><rect x="${X(t0)}" y="0" width="${Math.max(1, X(t1) - X(t0))}" height="${H}"/></clipPath>`;
    const fill = (id, colour, b, top, bottom) => {
      const g = ns("linearGradient", { id, gradientUnits: "userSpaceOnUse", x1: 0, x2: 0, y1: b.y, y2: b.y + b.h }, defs); g.style.setProperty("--f", colour);
      g.innerHTML = `<stop offset="0" style="stop-color:var(--f);stop-opacity:${top}"/><stop offset="1" style="stop-color:var(--f);stop-opacity:${bottom}"/>`;
      return `url(#${id})`;
    };
    const back = ns("g", {}, svg);
    bands.forEach(b => ns("rect", { class: "us-band", x: PADL - 4, y: b.y, width: w - PADL - PADR + 8, height: b.h, rx: 7 }, back));
    const step = tickStep(w - PADL - PADR);
    for (let m = Math.ceil(t0 / step) * step; m <= t1; m += step) {
      const x = X(m); ns("line", { class: "tl-grid", x1: x, x2: x, y1: 0, y2: H }, back);
      if (x > 14 && x < w - 14) ns("text", { class: "tl-tick", x, y: H + 17 }, back).textContent = clock(m);
    }
    ns("line", { class: "tl-base", x1: PADL - 4, x2: w - PADR + 4, y1: H + 4, y2: H + 4 }, back);
    const lines = ns("g", { "clip-path": "url(#rm-us-clip)" }, svg), over = ns("g", {}, svg);
    const yt = (x, yy, text, cls) => ns("text", { class: "us-yt" + (cls ? " " + cls : ""), x, y: yy }, over).textContent = text;

    // subscriptions
    if (byId.subs) {
      const b = byId.subs, Y = Yof(b, 0, 100);
      [[100, "100%"], [50, "50%"], [0, "0"]].forEach(([v, text]) => { const yy = Y(v); ns("line", { class: "tl-grid", x1: PADL, x2: w - PADR, y1: yy, y2: yy, opacity: v === 50 ? .5 : 0 }, back); yt(PADL + 3, v === 0 ? yy - 3 : yy + 10, text); });
      [...provs].reverse().forEach(p => {
        const colour = colourOf(p), g = ns("g", { class: "us-g", "data-p": p.id }, lines); g.style.setProperty("--c", colour);
        slotsOf(p).forEach((slot, si) => {
          slot.segs.forEach(seg => {
            const pts = seg.map(([m, v]) => [X(m), Y(v)]);
            if (pts.length < 2) { ns("circle", { class: "us-dot1", cx: pts[0][0], cy: pts[0][1], r: si ? 2 : 2.6 }, g); return; }
            ns("path", { class: "us-line" + (si ? " more" : ""), d: curve(pts) }, g);
          });
          slot.resets.forEach(r => ns("line", { class: "us-reset", x1: X(r), x2: X(r), y1: b.y + 2, y2: b.y + b.h - 2 }, g));
        });
        hover.push({ kind: "sub", p, y: Y, colour, g });
      });
    }

    // the Claude API credits: dollars left, a dashed line with no fill, each grant's expiry dotted
    if (byId.api) {
      const b = byId.api, top = Math.max(A.top, 1), Y = Yof(b, 0, top), colour = colourOf(A);
      [[top, usd(top)], [0, "$0"]].forEach(([v, text]) => { const yy = Y(v); ns("line", { class: "tl-grid", x1: PADL, x2: w - PADR, y1: yy, y2: yy, opacity: 0 }, back); yt(PADL + 3, v === 0 ? yy - 3 : yy + 10, text); });
      const g = ns("g", { class: "us-g", "data-p": A.id }, lines); g.style.setProperty("--c", colour);
      A.segs.forEach(seg => {
        const pts = seg.map(([m, v]) => [X(m), Y(v)]);
        if (pts.length < 2) { ns("circle", { class: "us-dot1", cx: pts[0][0], cy: pts[0][1], r: 2 }, g); return; }
        ns("path", { class: "us-line more", d: curve(pts) }, g);
      });
      A.expiries.forEach(r => ns("line", { class: "us-reset", x1: X(r), x2: X(r), y1: b.y + 2, y2: b.y + b.h - 2 }, g));
      hover.push({ kind: "api", y: Y, colour, g });
    }

    // the Mac
    const series = (b, arr, pkArr, colour, y, id, withFill, name) => {
      const g = ns("g", { class: "us-g" }, lines); g.style.setProperty("--c", colour);
      peakRuns(pkArr, y, w, a => Math.max(...a)).forEach(r => {
        const pts = r.length === 1 ? [[r[0][0] - 1, r[0][1]], [r[0][0] + 1, r[0][1]]] : r;
        ns("path", { class: "us-peak", d: poly(pts) + `L${f1(pts[pts.length - 1][0])} ${f1(y.base)}L${f1(pts[0][0])} ${f1(y.base)}Z` }, g);
      });
      runs(arr, y, w).forEach(r => {
        const pts = r.map(([x, yy]) => [x, yy]);
        if (pts.length < 2) { ns("circle", { class: "us-dot1", cx: pts[0][0], cy: pts[0][1], r: 2 }, g); return; }
        if (withFill) ns("path", { class: "us-fill", style: `--f:${fill(id, colour, b, .28, .02)}`, d: curve(pts) + `L${f1(pts[pts.length - 1][0])} ${f1(y.base)}L${f1(pts[0][0])} ${f1(y.base)}Z` }, g);
        ns("path", { class: "us-avg", d: curve(pts) }, g);
      });
    };
    if (byId.busy) {
      const b = byId.busy, Y = Yof(b, 0, 100); Y.base = Y(0);
      [[100, "100%"], [50, "50%"]].forEach(([v, text]) => { const yy = Y(v); ns("line", { class: "tl-grid", x1: PADL, x2: w - PADR, y1: yy, y2: yy, opacity: v === 50 ? .5 : 0 }, back); yt(PADL + 3, yy + 10, text); });
      if (mac.gpu) series(b, mac.gpu, mac.gpu_pk, "var(--rm-above)", Y, "rm-us-fg");
      if (mac.cpu) series(b, mac.cpu, mac.cpu_pk, "var(--rm-xhigh)", Y, "rm-us-fc");
      if (mac.cpu) hover.push({ kind: "cpu", y: Y, colour: "var(--rm-xhigh)" });
      if (mac.gpu) hover.push({ kind: "gpu", y: Y, colour: "var(--rm-above)" });
    }
    if (byId.mem) {
      const b = byId.mem, total = mac.mem_total || Math.max(peakOf(mac.mem_pk) * 1.1, 1), Y = Yof(b, 0, total); Y.base = Y(0);
      ns("line", { class: "us-ref", x1: PADL, x2: w - PADR, y1: Y(total), y2: Y(total) }, back); yt(PADL + 3, Y(total) + 10, fmt(total, 0) + " GB");
      series(b, mac.mem, mac.mem_pk, "var(--rm-high)", Y, "rm-us-fm", true); hover.push({ kind: "mem", y: Y, colour: "var(--rm-high)" });
    }
    if (byId.disk) {
      const b = byId.disk, lo0 = Math.min(...diskVals, ...mac.disk_pk.filter(num)), hi0 = Math.max(...diskVals), pad = Math.max(1, (hi0 - lo0) * 0.3);
      const lo = Math.floor(lo0 - pad), hi = Math.ceil(hi0 + pad), Y = Yof(b, lo, hi); Y.base = b.y + b.h - BOT;
      yt(PADL + 3, b.y + 11, hi + " GB"); yt(PADL + 3, b.y + b.h - 6, lo + " GB");
      const g = ns("g", { class: "us-g" }, lines); g.style.setProperty("--c", "var(--rm-warn)");
      peakRuns(mac.disk_pk, Y, w, a => Math.min(...a)).forEach(r => { if (r.length > 1) ns("path", { class: "us-low", d: poly(r) }, g); });  // the lowest reading of each minute
      runs(mac.disk, Y, w).forEach(r => {
        const pts = r.map(([x, yy]) => [x, yy]);
        if (pts.length < 2) { ns("circle", { class: "us-dot1", cx: pts[0][0], cy: pts[0][1], r: 2 }, g); return; }
        ns("path", { class: "us-fill", style: `--f:${fill("rm-us-fd", "var(--rm-warn)", b, .26, .02)}`, d: curve(pts) + `L${f1(pts[pts.length - 1][0])} ${f1(Y.base)}L${f1(pts[0][0])} ${f1(Y.base)}Z` }, g);
        ns("path", { class: "us-avg", d: curve(pts) }, g);
      });
      hover.push({ kind: "disk", y: Y, colour: "var(--rm-warn)" });
    }
    gHover = ns("g", { class: "us-hover" }, svg); gHover.style.display = "none";
    cross = ns("line", { class: "us-cross", y1: 0, y2: H }, gHover);
    hover.forEach(h => { h.dots = []; });
    if (lastX != null) show(lastX);
  }

  // hovering: a crosshair with the values at that minute and the tasks working then
  const working = m => {
    const out = [];
    const on = n => (n.turns || []).length ? n.turns.some(([a, b]) => a <= m && m <= b) : (n.launched != null && n.launched <= m && m <= n.ended);
    if (ORCH.turns && ORCH.turns.length && ORCH.turns.some(([a, b]) => a <= m && m <= b)) out.push("Orchestrator");
    tasks.filter(timed).forEach(t => { if (on(t)) out.push(`${t.id} · ${t.name}`); });
    return out;
  };
  const macAt = (arr, m) => { const i = Math.floor(m) - U.start; return arr && i >= 0 && i < arr.length ? arr[i] : null; };
  function show(mx, clientX) {
    const w = plot.clientWidth; if (!gHover || w < 60) return;
    const m = Math.min(t1, Math.max(t0, mx)), x = X(m);
    lastX = mx; gHover.style.display = ""; cross.setAttribute("x1", x); cross.setAttribute("x2", x);
    gHover.querySelectorAll(".us-hdot").forEach(e => e.remove());
    const dot = (yy, colour) => { const d = ns("circle", { class: "us-hdot", cx: x, cy: yy, r: 3.6 }, gHover); d.style.setProperty("--c", colour); };
    tip.replaceChildren();
    const when = el("div", "when", clock(m)); when.append(el("span", null, m >= runStart ? `${dur(m - runStart)} into the run` : "before the run")); tip.append(when);
    const row = (parent, name, value, colour) => {
      const r = el("div", "r"), k = el("span", "k"), v = el("span", "v"); if (colour) { k.style.setProperty("--c", colour); k.append(el("i")); }
      k.append(name); v.innerHTML = value; r.append(k, v); parent.append(r);
    };
    if (byId.subs) {
      tip.append(el("div", "sec", "Subscriptions"));
      hover.filter(h => h.kind === "sub").reverse().forEach(h => {
        const p = h.p, bits = [];
        slotsOf(p).forEach(slot => { const v = valueAt(slot, m);
          if (v != null) { bits.push(`<em>${shortOf(slot)}</em> ${pc(v)}`); dot(h.y(v), h.colour); }
          const near = slot.resets.find(r => Math.abs(r - m) <= Math.max(1.5, 5 * (t1 - t0) / Math.max(1, w))); if (near != null) bits.push(`↺ resets ${clock(near)}`); });
        row(tip, p.name, bits.length ? bits.join(" · ") + " <em>left</em>" : "<em>no reading</em>", h.colour);
      });
    }
    if (byId.api) {
      const h = hover.find(h => h.kind === "api"), v = valueAt({ segs: A.segs }, m), bits = [];
      tip.append(el("div", "sec", "Claude API credits (estimate)"));
      if (v != null) { bits.push(`${usd(v)} <em>left</em>`); dot(h.y(v), h.colour); }
      const near = A.expiries.find(r => Math.abs(r - m) <= Math.max(1.5, 5 * (t1 - t0) / Math.max(1, w))); if (near != null) bits.push(`a credit expires ${clock(near)}`);
      row(tip, A.name, bits.length ? bits.join(" · ") : "<em>no reading</em>", h.colour);
    }
    if (mac) {
      tip.append(el("div", "sec", "This Mac"));
      const both = (name, avg, pkv, h, unit, colour) => { const a = macAt(avg, m), k = macAt(pkv, m); if (a == null) return;
        row(tip, name, `${fmt(a, 0)}${unit} <em>avg</em> · ${fmt(k, 0)}${unit} <em>peak</em>`, colour); dot(h.y(a), h.colour); };
      hover.forEach(h => {
        if (h.kind === "cpu") both("CPU", mac.cpu, mac.cpu_pk, h, "%", "var(--rm-xhigh)");
        if (h.kind === "gpu") both("GPU", mac.gpu, mac.gpu_pk, h, "%", "var(--rm-above)");
        if (h.kind === "mem") { const a = macAt(mac.mem, m), k = macAt(mac.mem_pk, m); if (a != null) { row(tip, "Memory", `${fmt(a)} <em>of ${fmt(mac.mem_total || 0, 0)} GB · peak</em> ${fmt(k)}`, "var(--rm-high)"); dot(h.y(a), h.colour); } }
        if (h.kind === "disk") { const a = macAt(mac.disk, m); if (a != null) { const lo = macAt(mac.disk_pk, m); row(tip, "Free disk", `${fmt(a)} GB` + (lo != null && lo < a ? ` <em>· lowest</em> ${fmt(lo)}` : ""), "var(--rm-warn)"); dot(h.y(a), h.colour); } }
      });
    }
    const who = el("div", "who2"), names = working(m);
    who.innerHTML = names.length ? `<b>Working:</b> ` + names.map(n => n.replace(/&/g, "&amp;").replace(/</g, "&lt;")).join(", ") : "No task working";
    tip.append(who);
    tip.hidden = false;
    const b = S.getBoundingClientRect(), pr = plot.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = pr.left - b.left + x + 16;
    if (left + tw > b.width - 8) left = pr.left - b.left + x - 16 - tw;
    tip.style.left = Math.max(8, left) + "px"; tip.style.top = Math.min(Math.max(8, pr.top - b.top + 4), Math.max(8, b.height - th - 8)) + "px";
    requestAnimationFrame(() => tip.classList.add("on"));
  }
  function hide() { lastX = null; if (gHover) gHover.style.display = "none"; tip.classList.remove("on"); tip.hidden = true; }
  const minuteAt = e => { const r = plot.getBoundingClientRect(); return t0 + (e.clientX - r.left - PADL) / (plot.clientWidth - PADL - PADR) * (t1 - t0); };
  plot.addEventListener("pointermove", e => { const m = minuteAt(e); if (m < t0 - 1 || m > t1 + 1) hide(); else show(m); });
  plot.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse") show(minuteAt(e)); });
  plot.addEventListener("pointerleave", hide);
  function focusProv(id) {
    S.classList.toggle("focus", !!id);
    provLabs.forEach(l => l.classList.toggle("on", l._id === id));
    svg.querySelectorAll(".us-g[data-p]").forEach(g => g.classList.toggle("on", g.dataset.p === id));
  }
  draw();
  const at = /cross=(\d+):(\d+)/.exec(location.hash);  // #cross=HH:MM puts the crosshair there (hours past 24 for the next day), for a picture
  if (at) { show(+at[1] * 60 + +at[2] + 0.5); tip.style.transition = "none"; tip.classList.add("on"); }
  let lastW = plot.clientWidth;
  new ResizeObserver(() => { if (Math.abs(plot.clientWidth - lastW) > 1) { lastW = plot.clientWidth; draw(); } }).observe(plot);
  svg.setAttribute("aria-label", `Usage of the run, ${clock(t0)} to ${clock(t1)}: ` + [...provs.filter(p => p.long).map(p => `${p.name} ` + slotsOf(p).map(s => `${s.label} ${pc(ends(s)[0])} to ${pc(ends(s)[1])} left`).join(", ")),
    ...(A ? [`${A.name} ${usd(apiEnds[0])} to ${usd(apiEnds[1])} left (estimate)`] : []),
    ...(pk ? [`the Mac peaked at ${num(pk.cpu) ? fmt(pk.cpu, 0) + "% CPU" : ""}${num(pk.gpu) ? ", " + fmt(pk.gpu, 0) + "% GPU" : ""}`] : [])].join("; "));
})();

// start
chooseOrder();
rows = rows.map(r => withRelaunches(r || []));
if (/open/.test(location.hash)) nodes.forEach(n => { if (n.helpers.length) toggleKids(n, true); });
layout(true); /fit/.test(location.hash) ? fit() : home();
const at = /at=([A-Za-z0-9_-]+)/.exec(location.hash); if (at && byId[at[1]]) zoomTo(byId[at[1]], 0.72);
let lastW = cv.clientWidth;
new ResizeObserver(() => { if (Math.abs(cv.clientWidth - lastW) > 2) { lastW = cv.clientWidth; layout(true); home(); } }).observe(cv);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layout(true));
window.runMap = { cards, layout, bounds: () => bounds, view: () => view };
console.log(`run map ready: ${tasks.length} tasks, ${cards.length} cards`);
} catch (e) {
  root.replaceChildren(Object.assign(document.createElement("p"), { className: "rm-error", textContent: "The run map couldn't be drawn: " + e.message }));
  console.error("run map failed: " + (e.stack || e));
}
})();
</script>
</body>
